version: "3.9"

services:

  postgres:
    image: postgres:15
    container_name: khana_postgres
    environment:
      POSTGRES_DB: khana_khazana
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - khana_network

  app:
    image: harshkatiyar19/khana-khazana:latest
    container_name: khana_app
    depends_on:
      - postgres
#    environment:
#      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/khana_khazana
#      SPRING_DATASOURCE_USERNAME: postgres
#      SPRING_DATASOURCE_PASSWORD: mysecretpassword
#      SPRING_JPA_HIBERNATE_DDL_AUTO: update
#      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
#      SPRING_JPA_SHOW_SQL: "true"
#      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - khana_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  khana_network:
    driver: bridge
